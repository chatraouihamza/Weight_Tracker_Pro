plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.weighttrackerapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.weighttrackerapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }}
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    // --- Core Android (Java versions) ---
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // --- Material Design 3 ---
    implementation 'com.google.android.material:material:1.11.0'

    // --- Navigation (Java versions) ---
    // Changed navigation-*-ktx -> navigation-*
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // --- Lifecycle (Java versions) ---
    // Changed lifecycle-*-ktx -> lifecycle-*
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    // Optional: for ProcessLifecycleOwner if needed later
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // --- Room Database (Java versions) ---
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    // CRITICAL: Removed room-ktx (coroutines support) since we use Java ExecutorService

    // CRITICAL: This generates the AppDatabase_Impl file
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // --- Charts ---
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // --- Retrofit & OkHttp ---
    implementation 'com.squareup.retrofit2:retrofit:2.10.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // --- Gson ---
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- Glide ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // --- WorkManager (Java version) ---
    // Changed work-runtime-ktx -> work-runtime
    implementation 'androidx.work:work-runtime:2.9.0'

    // --- Security ---
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // --- Preferences (Java version) ---
    // Changed preference-ktx -> preference
    implementation 'androidx.preference:preference:1.2.1'

    // --- Tests ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
